[SERVICE]
    Flush                       1
    Grace                       5
    Log_Level                   warn
    storage.path                /data/buffer
    storage.sync                normal
    storage.checksum            on
    storage.max_chunks_up       8
    storage.backlog.mem_limit   2M

[INPUT]
    Name                        forward
    Listen                      0.0.0.0
    Port                        24224
    Buffer_Chunk_Size           64K
    Buffer_Max_Size             2M
    storage.type                filesystem

[OUTPUT]
    Name                        http
    Match                       ticketya.*
    Host                        127.0.0.1
    Port                        9881
    URI                         /ingest
    Format                      json_lines
    Json_Date_Key               false
    Retry_Limit                 no_limits
    storage.total_limit_size    8M
