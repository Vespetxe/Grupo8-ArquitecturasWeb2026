    "/accesos/eventos/{event}/validaciones": {
      "post": {
        "operationId": "entradas_post_accesos_eventos_event_validaciones",
        "summary": "Ingreso QR atómico, único y con asignación",
        "description": "Contrato E2. El servidor es autoridad de identidad/propiedad y estado. No realizar retries automáticos de escrituras.",
        "tags": [
          "Control de acceso"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "x-roles": [
          "PERSONAL_ACCESO"
        ],
        "parameters": [
          {
            "name": "event",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Resultado según el estado real del dominio",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accepted": {
                      "type": "boolean"
                    },
                    "code": {
                      "type": "string"
                    },
                    "ticketId": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "eventId": {
                      "type": "string"
                    },
                    "validatedAt": {
                      "type": [
                        "string",
                        "null"
                      ],
                      "format": "date-time"
                    }
                  }
                },
                "example": {
                  "accepted": true,
                  "code": "ejemplo",
                  "ticketId": "ejemplo",
                  "eventId": "ejemplo",
                  "validatedAt": "2030-12-01T21:00:00Z"
                }
              }
            }
          },
          "400": {
            "description": "Entrada inválida"
          },
          "401": {
            "description": "JWT inválido, ausente o vencido"
          },
          "403": {
            "description": "Rol, propiedad o asignación insuficiente"
          },
          "404": {
            "description": "Recurso no existente o ajeno"
          },
          "409": {
            "description": "Conflicto, resultado pendiente, turno no habilitado o entrada no utilizable según operación"
          },
          "503": {
            "description": "Falla técnica, sin éxito ni rechazo comercial inferidos"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "qr": {
                    "type": "string",
                    "format": "uuid"
                  }
                },
                "required": [
                  "qr"
                ]
              },
              "example": {
                "qr": "00000000-0000-4000-8000-000000000001"
              }
            }
          }
        },
        "x-visibility": "publica"
      }
    },
