  "components": {
    "schemas": {
      "Ticket": {
        "type": "object",
        "properties": {
          "orderId": {
            "type": "string"
          },
          "eventId": {
            "type": "string"
          },
          "clientId": {
            "type": "string"
          },
          "sectorId": {
            "type": "string"
          },
          "ticketId": {
            "type": "string",
            "format": "uuid"
          },
          "qr": {
            "type": "string",
            "format": "uuid"
          },
          "seatId": {
            "type": [
              "string",
              "null"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "EMITIDA",
              "ANULADA",
              "REINTEGRADA"
            ]
          }
        },
        "required": [
          "ticketId",
          "qr",
          "orderId",
          "eventId",
          "clientId",
          "sectorId",
          "status"
        ]
      },
      "ApiError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "IssueTicketsRequest": {
        "type": "object",
        "properties": {
          "orderId": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "orderId"
        ]
      },
      "TicketIssuanceResult": {
        "type": "object",
        "properties": {
          "tickets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Ticket"
            }
          },
          "created": {
            "type": "boolean"
          }
        },
        "required": [
          "tickets",
          "created"
        ]
      },
      "TicketStatusRequest": {
        "type": "object",
        "properties": {
          "orderId": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ANULADA",
              "REINTEGRADA"
            ]
          }
        },
        "required": [
          "orderId",
          "status"
        ]
      },
      "OrderEventStatusRequest": {
        "type": "object",
        "properties": {
          "orderId": {
            "type": "string"
          },
          "eventId": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ANULADA",
              "REINTEGRADA"
            ]
          }
        },
        "required": [
          "orderId",
          "eventId",
          "status"
        ]
      },
      "ErrorHTTP": {
        "type": "object",
        "properties": {
          "timestamp": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "error": {
            "type": "string"
          },
          "path": {
            "type": "string"
          }
        },
        "required": []
      }
    }
  }
}
