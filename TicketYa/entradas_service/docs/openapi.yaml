{
  "openapi": "3.1.0",
  "info": {
    "title": "TicketYa - Entradas - Entrega 1",
    "version": "entrega-1",
    "description": "Consulta publica y coordinacion interna. Los IDs de dominio se transportan como cadenas numericas; ticketId y qr son UUID. No incluye validacion de acceso QR."
  },
  "servers": [
    {
      "url": "http://localhost:8083"
    }
  ],
  "paths": {
    "/tickets": {
      "get": {
        "summary": "Consultar por exactamente uno de orderId o clientId",
        "responses": {
          "200": {
            "description": "Operacion completada o repetida",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Ticket"
                  }
                },
                "example": [
                  {
                    "ticketId": "00000000-0000-4000-8000-000000000001",
                    "qr": "00000000-0000-4000-8000-000000000002",
                    "orderId": "1",
                    "eventId": "1",
                    "clientId": "1",
                    "sectorId": "1",
                    "seatId": "1",
                    "status": "EMITIDA"
                  }
                ]
              }
            }
          },
          "400": {
            "description": "Solicitud invalida",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "INVALID_TICKET_QUERY",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "500": {
            "description": "Error interno; no interpretar como ausencia de efectos",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "timestamp": "2030-12-01T21:00:00",
                  "status": 500,
                  "message": "Operacion no completada"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "orderId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "clientId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "x-visibility": "publica",
        "operationId": "entradas_get_tickets",
        "description": "Operacion implementada por entradas. Accesible por el Gateway."
      }
    },
    "/internal/tickets/issue": {
      "post": {
        "summary": "Emitir el lote de una orden habilitada",
        "responses": {
          "200": {
            "description": "Operacion completada o repetida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TicketIssuanceResult"
                },
                "example": {
                  "tickets": [
                    {
                      "ticketId": "00000000-0000-4000-8000-000000000001",
                      "qr": "00000000-0000-4000-8000-000000000002",
                      "orderId": "1",
                      "eventId": "1",
                      "clientId": "1",
                      "sectorId": "1",
                      "seatId": "1",
                      "status": "EMITIDA"
                    }
                  ],
                  "created": true
                }
              }
            }
          },
          "201": {
            "description": "Lote creado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TicketIssuanceResult"
                },
                "example": {
                  "tickets": [
                    {
                      "ticketId": "00000000-0000-4000-8000-000000000001",
                      "qr": "00000000-0000-4000-8000-000000000002",
                      "orderId": "1",
                      "eventId": "1",
                      "clientId": "1",
                      "sectorId": "1",
                      "seatId": "1",
                      "status": "EMITIDA"
                    }
                  ],
                  "created": true
                }
              }
            }
          },
          "400": {
            "description": "Solicitud invalida",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "INVALID_REQUEST",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "404": {
            "description": "Recurso inexistente",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "ORDER_NOT_FOUND",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "409": {
            "description": "Orden no habilitada o cancelada",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "ORDER_NOT_CONFIRMED",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "422": {
            "description": "Seleccion incompatible",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "INVALID_ORDER",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "503": {
            "description": "Compras no disponible",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "code": "ORDERS_UNAVAILABLE",
                  "message": "Operacion no completada"
                }
              }
            }
          },
          "500": {
            "description": "Error interno; no interpretar como ausencia de efectos",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "timestamp": "2030-12-01T21:00:00",
                  "status": 500,
                  "message": "Operacion no completada"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IssueTicketsRequest"
              },
              "example": {
                "orderId": "1"
              }
            }
          }
        },
        "x-visibility": "interna",
        "operationId": "entradas_post_internal_tickets_issue",
        "description": "Operacion implementada por entradas. Llamada directa entre servicios; excluida del Gateway normal."
      }
    },
