          "200": {
            "description": "Operacion completada o repetida"
          },
          "500": {
            "description": "Error interno; no interpretar como ausencia de efectos",
            "content": {
              "application/json": {
                "schema": {
                  "anyOf": [
                    {
                      "$ref": "#/components/schemas/ApiError"
                    },
                    {
                      "$ref": "#/components/schemas/ErrorHTTP"
                    }
                  ]
                },
                "example": {
                  "timestamp": "2030-12-01T21:00:00",
                  "status": 500,
                  "message": "Operacion no completada"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
