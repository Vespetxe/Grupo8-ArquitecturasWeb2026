spring.application.name=eventos-catalogo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventos_catalogo_DB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
ticketya.inventario.base-url=${INVENTARIO_BASE_URL:http://localhost:8082}
ticketya.compras.base-url=${COMPRAS_BASE_URL:http://localhost:8084}
ticketya.entradas.base-url=${ENTRADAS_BASE_URL:http://localhost:8083}
