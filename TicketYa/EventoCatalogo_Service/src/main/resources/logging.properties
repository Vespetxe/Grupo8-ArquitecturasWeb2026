# Native ECS request logs. No request/response bodies, raw URLs or arbitrary MDC.
logging.structured.format.console=ecs
spring.main.banner-mode=off
logging.structured.json.include=@timestamp,log,log.level,log.logger,service,service.name,message,ecs,ecs.version,eventType,correlationId,httpMethod,httpRoute,httpStatus,durationMs,actorType,actorId,errorCategory,completion,trace,trace.id,span,span.id,traceId,spanId,eventId,timestamp,action,auditScope,resourceType,resourceId,operationId,outcome,resourceState,actorVerified,initiatorId,initiatorType,errorCode,dependency,operation,circuit,circuitState
logging.structured.json.exclude=error.message,error.stack_trace
logging.structured.ecs.service.name=${spring.application.name:EventoCatalogo_Service}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# W3C propagation, no exporters or management HTTP endpoints.
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
management.tracing.baggage.enabled=false
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
spring.reactor.context-propagation=auto

