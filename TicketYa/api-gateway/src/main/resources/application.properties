spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
ticketya.eventos.url=${EVENTOS_BASE_URL:http://localhost:8081}
ticketya.inventario.url=${INVENTARIO_BASE_URL:http://localhost:8082}
ticketya.entradas.url=${ENTRADAS_BASE_URL:http://localhost:8083}
ticketya.compras.url=${COMPRAS_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s
