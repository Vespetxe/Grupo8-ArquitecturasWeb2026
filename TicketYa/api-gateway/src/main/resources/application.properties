spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
ticketya.identidad.url=${IDENTIDAD_BASE_URL:http://identidad:8085}
ticketya.eventos.url=${EVENTOS_BASE_URL:http://localhost:8081}
ticketya.inventario.url=${INVENTARIO_BASE_URL:http://localhost:8082}
ticketya.entradas.url=${ENTRADAS_BASE_URL:http://localhost:8083}
ticketya.compras.url=${COMPRAS_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${TY_HTTP_CONNECT_MS:1000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${TY_GATEWAY_RESPONSE_TIMEOUT:15s}
ticketya.gateway.budget-ms=${TY_GATEWAY_BUDGET_MS:15000}
ticketya.gateway.pool-size=${TY_GATEWAY_POOL_SIZE:50}
ticketya.gateway.pending-max=${TY_GATEWAY_PENDING_MAX:100}
ticketya.gateway.acquire-ms=${TY_HTTP_ACQUIRE_MS:500}

spring.config.import=classpath:logging.properties
