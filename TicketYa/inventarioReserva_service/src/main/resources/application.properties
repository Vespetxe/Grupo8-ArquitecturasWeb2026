spring.application.name=inventario-reservas
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_inventario_reservas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.config.import=classpath:logging.properties

# Bounded waits; no timeout is applied to an in-flight financial commit.
ticketya.time.budget-ms=${TY_TIME_BUDGET_MS:12000}
ticketya.jdbc.acquire-ms=${TY_JDBC_ACQUIRE_MS:2000}
ticketya.jdbc.pool-size=${TY_JDBC_POOL_SIZE:10}
ticketya.jdbc.connect-ms=${TY_JDBC_CONNECT_MS:1000}
ticketya.jdbc.lock-seconds=${TY_JDBC_LOCK_SECONDS:3}
