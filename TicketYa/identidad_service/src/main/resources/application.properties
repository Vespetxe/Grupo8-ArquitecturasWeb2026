spring.application.name=identidad-service
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
identity.jwt.issuer=${IDENTITY_JWT_ISSUER}
identity.jwt.audiences=${IDENTITY_JWT_AUDIENCES}
identity.jwt.private-key=${IDENTITY_JWT_PRIVATE_KEY}
identity.jwt.public-key=${IDENTITY_JWT_PUBLIC_KEY}
identity.jwt.key-id=${IDENTITY_JWT_KEY_ID}
identity.jwt.user-ttl=15m
identity.jwt.privileged-ttl=5m
identity.jwt.service-ttl=2m
logging.level.org.springframework.security=INFO

spring.config.import=classpath:logging.properties

# Bounded waits; no timeout is applied to an in-flight financial commit.
ticketya.time.budget-ms=${TY_TIME_BUDGET_MS:12000}
ticketya.jdbc.acquire-ms=${TY_JDBC_ACQUIRE_MS:2000}
ticketya.jdbc.pool-size=${TY_JDBC_POOL_SIZE:5}
ticketya.jdbc.connect-ms=${TY_JDBC_CONNECT_MS:1000}
ticketya.jdbc.lock-seconds=${TY_JDBC_LOCK_SECONDS:3}
