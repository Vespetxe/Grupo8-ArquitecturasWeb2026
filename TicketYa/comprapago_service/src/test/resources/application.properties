# Nunca heredar el datasource de desarrollo al ejecutar tests.
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:ticketya_compras_security_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
compras.limite-entradas-por-cliente-evento=6
