# JUnit never uses the historical MySQL profile from src/main/resources.
spring.datasource.url=jdbc:h2:mem:ticketya_compras_security_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
compras.limite-entradas-por-cliente-evento=6
