spring.application.name=compras-service
spring.config.import=classpath:logging.properties

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_compras}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

compras.limite-entradas-por-cliente-evento=6

spring.profiles.default=integracion
server.port=8084
ticketya.eventos.base-url=${EVENTOS_BASE_URL:http://localhost:8081}
ticketya.inventario.base-url=${INVENTARIO_BASE_URL:http://localhost:8082}
ticketya.entradas.base-url=${ENTRADAS_BASE_URL:http://localhost:8083}

# Bounded waits; no timeout is applied to an in-flight financial commit.
ticketya.time.budget-ms=${TY_TIME_BUDGET_MS:12000}
ticketya.jdbc.acquire-ms=${TY_JDBC_ACQUIRE_MS:2000}
ticketya.jdbc.pool-size=${TY_JDBC_POOL_SIZE:10}
ticketya.jdbc.connect-ms=${TY_JDBC_CONNECT_MS:1000}
ticketya.jdbc.lock-seconds=${TY_JDBC_LOCK_SECONDS:3}
ticketya.http.connect-ms=${TY_HTTP_CONNECT_MS:1000}
ticketya.http.read-ms=${TY_HTTP_READ_MS:2000}
ticketya.http.command-ms=${TY_HTTP_COMMAND_MS:4000}
ticketya.http.token-ms=${TY_HTTP_TOKEN_MS:3000}
ticketya.http.acquire-ms=${TY_HTTP_ACQUIRE_MS:500}
ticketya.http.pool-size=${TY_HTTP_POOL_SIZE:40}
ticketya.http.per-route=${TY_HTTP_PER_ROUTE:10}

# Selective GET pilot: no retries or waiting queue.
ticketya.resilience.read.window=${TY_READ_WINDOW:20}
ticketya.resilience.read.minimum=${TY_READ_MINIMUM:10}
ticketya.resilience.read.failure-percent=${TY_READ_FAILURE_PERCENT:50}
ticketya.resilience.read.open-ms=${TY_READ_OPEN_MS:10000}
ticketya.resilience.read.half-open-calls=${TY_READ_HALF_OPEN_CALLS:2}
ticketya.resilience.read.concurrent=${TY_READ_CONCURRENT:8}

# Bounded technical-token renewal; cached usable tokens bypass admission.
ticketya.resilience.oauth.concurrent=${TY_OAUTH_CONCURRENT:2}
ticketya.resilience.oauth.window=${TY_OAUTH_WINDOW:20}
ticketya.resilience.oauth.minimum=${TY_OAUTH_MINIMUM:10}
ticketya.resilience.oauth.failure-percent=${TY_OAUTH_FAILURE_PERCENT:50}
ticketya.resilience.oauth.open-ms=${TY_OAUTH_OPEN_MS:10000}
