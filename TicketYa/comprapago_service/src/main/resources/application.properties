spring.application.name=compras-service

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticketya_compras}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

compras.limite-entradas-por-cliente-evento=6

spring.profiles.default=integracion
server.port=8084
ticketya.eventos.base-url=${EVENTOS_BASE_URL:http://localhost:8081}
ticketya.inventario.base-url=${INVENTARIO_BASE_URL:http://localhost:8082}
ticketya.entradas.base-url=${ENTRADAS_BASE_URL:http://localhost:8083}
