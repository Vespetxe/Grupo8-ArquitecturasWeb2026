# Native Spring Boot ECS, stdout only. No external encoder or tracing is installed.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name:compras-service}
spring.main.banner-mode=off

# Explicit contract: arbitrary MDC/SLF4J fields and raw Throwable data are excluded.
# Future context fields require an explicit contract change, not invented values.
logging.structured.json.include=@timestamp,log,log.level,log.logger,service,service.name,message,ecs,ecs.version,errorCode,errorCategory,exceptionType,rootErrorCategory,errorOrigin,compraId,devolucionId,eventoId,etapa,trace,trace.id,span,span.id,traceId,spanId,eventType,correlationId,httpMethod,httpRoute,httpStatus,durationMs,actorType,actorId,completion,eventId,timestamp,action,auditScope,resourceType,resourceId,operationId,outcome,resourceState,actorVerified,initiatorId,initiatorType,dependency,operation,circuit,circuitState
logging.structured.json.exclude=error.message,error.stack_trace

# Failures are diagnosed by the application without queries or parameter values.
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# W3C propagation, no exporters or management HTTP endpoints.
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
management.tracing.baggage.enabled=false
management.endpoints.web.exposure.exclude=*
management.endpoints.jmx.exposure.exclude=*
spring.reactor.context-propagation=auto
