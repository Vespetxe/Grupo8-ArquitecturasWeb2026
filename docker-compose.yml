name: ticketya-e2-infra

services:
  mysql:
    image: mysql:8.4.8
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: ${TY_E2_MYSQL_ROOT_PASSWORD:?Definir TY_E2_MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      TY_E2_EVENTOS_DB_PASSWORD: ${TY_E2_EVENTOS_DB_PASSWORD:?Definir TY_E2_EVENTOS_DB_PASSWORD}
      TY_E2_INVENTARIO_DB_PASSWORD: ${TY_E2_INVENTARIO_DB_PASSWORD:?Definir TY_E2_INVENTARIO_DB_PASSWORD}
      TY_E2_ENTRADAS_DB_PASSWORD: ${TY_E2_ENTRADAS_DB_PASSWORD:?Definir TY_E2_ENTRADAS_DB_PASSWORD}
      TY_E2_COMPRAS_DB_PASSWORD: ${TY_E2_COMPRAS_DB_PASSWORD:?Definir TY_E2_COMPRAS_DB_PASSWORD}
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
      - type: bind
        source: ./docker/mysql/01-create-schemas.sql
        target: /docker-entrypoint-initdb.d/01-create-schemas.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/mysql/02-create-users.sh
        target: /docker-entrypoint-initdb.d/02-create-users.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "/docker-entrypoint-initdb.d/02-create-users.sh", "--healthcheck"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 90s

  inventario:
    image: ticketya-e2-inventario:dev
    build:
      context: ./TicketYa/inventarioReserva_service
    pull_policy: never
    environment:
      SERVER_PORT: "8082"
      SPRING_PROFILES_ACTIVE: integracion
      TY_SECURITY_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      TY_SECURITY_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
      TY_SECURITY_PUBLIC_KEY: /run/verification/public.pem
      DB_URL: "jdbc:mysql://mysql:3306/ticketya_e2_docker_inventario?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ty_inventario
      DB_PASSWORD: ${TY_E2_INVENTARIO_DB_PASSWORD:?Definir TY_E2_INVENTARIO_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}/public.pem
        target: /run/verification/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  entradas:
    image: ticketya-e2-entradas:dev
    build:
      context: ./TicketYa/entradas_service
    pull_policy: never
    environment:
      SERVER_PORT: "8083"
      SPRING_PROFILES_ACTIVE: integracion
      TY_SECURITY_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      TY_SECURITY_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
      TY_SECURITY_PUBLIC_KEY: /run/verification/public.pem
      TY_SECURITY_TOKEN_URL: http://identidad:8085/oauth2/token
      TY_SECURITY_COMPRAS_SECRET: ${TY_SECURITY_ENTRADAS_COMPRAS_SECRET:-}
      DB_URL: "jdbc:mysql://mysql:3306/ticketya_e2_docker_entradas?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ty_entradas
      DB_PASSWORD: ${TY_E2_ENTRADAS_DB_PASSWORD:?Definir TY_E2_ENTRADAS_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      COMPRAS_BASE_URL: http://compras:8084
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}/public.pem
        target: /run/verification/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  compras:
    image: ticketya-e2-compras:dev
    build:
      context: ./TicketYa/comprapago_service
    pull_policy: never
    environment:
      SERVER_PORT: "8084"
      SPRING_PROFILES_ACTIVE: integracion
      TY_SECURITY_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      TY_SECURITY_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
      TY_SECURITY_PUBLIC_KEY: /run/verification/public.pem
      TY_SECURITY_TOKEN_URL: http://identidad:8085/oauth2/token
      TY_SECURITY_EVENTOS_SECRET: ${TY_SECURITY_COMPRAS_EVENTOS_SECRET:-}
      TY_SECURITY_INVENTARIO_SECRET: ${TY_SECURITY_COMPRAS_INVENTARIO_SECRET:-}
      TY_SECURITY_ENTRADAS_SECRET: ${TY_SECURITY_COMPRAS_ENTRADAS_SECRET:-}
      DB_URL: "jdbc:mysql://mysql:3306/ticketya_e2_docker_compras?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ty_compras
      DB_PASSWORD: ${TY_E2_COMPRAS_DB_PASSWORD:?Definir TY_E2_COMPRAS_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EVENTOS_BASE_URL: http://eventos:8081
      INVENTARIO_BASE_URL: http://inventario:8082
      ENTRADAS_BASE_URL: http://entradas:8083
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}/public.pem
        target: /run/verification/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  eventos:
    image: ticketya-e2-eventos:dev
    build:
      context: ./TicketYa/EventoCatalogo_Service
    pull_policy: never
    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: integracion
      TY_SECURITY_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      TY_SECURITY_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
      TY_SECURITY_PUBLIC_KEY: /run/verification/public.pem
      TY_SECURITY_TOKEN_URL: http://identidad:8085/oauth2/token
      TY_SECURITY_INVENTARIO_SECRET: ${TY_SECURITY_EVENTOS_INVENTARIO_SECRET:-}
      TY_SECURITY_ENTRADAS_SECRET: ${TY_SECURITY_EVENTOS_ENTRADAS_SECRET:-}
      TY_SECURITY_COMPRAS_SECRET: ${TY_SECURITY_EVENTOS_COMPRAS_SECRET:-}
      DB_URL: "jdbc:mysql://mysql:3306/ticketya_e2_docker_eventos?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ty_eventos
      DB_PASSWORD: ${TY_E2_EVENTOS_DB_PASSWORD:?Definir TY_E2_EVENTOS_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      INVENTARIO_BASE_URL: http://inventario:8082
      COMPRAS_BASE_URL: http://compras:8084
      ENTRADAS_BASE_URL: http://entradas:8083
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}/public.pem
        target: /run/verification/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  # Opt-in only: existing MySQL needs a separately authorized additive migration.
  # Do not activate this profile until its schema, credential and external keys exist.
  identidad:
    profiles: [identidad]
    image: ticketya-e2-identidad:dev
    build:
      context: ./TicketYa/identidad_service
    pull_policy: never
    environment:
      SERVER_PORT: "8085"
      SPRING_PROFILES_ACTIVE: integracion
      DB_URL: "jdbc:mysql://mysql:3306/ticketya_e2_docker_identidad?allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ty_identidad
      DB_PASSWORD: ${TY_E2_IDENTIDAD_DB_PASSWORD:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      IDENTITY_JWT_AUDIENCES: ticketya-identidad,ticketya-gateway,ticketya-eventos,ticketya-inventario,ticketya-entradas,ticketya-compras
      IDENTITY_JWT_PRIVATE_KEY: /run/identity-keys/private.pem
      IDENTITY_JWT_PUBLIC_KEY: /run/identity-keys/public.pem
      IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}
        target: /run/identity-keys
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  gateway:
    image: ticketya-e2-gateway:dev
    build:
      context: ./TicketYa/api-gateway
    pull_policy: never
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: integracion
      TY_SECURITY_ISSUER: ${IDENTITY_JWT_ISSUER:-http://identidad:8085}
      TY_SECURITY_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-key-1}
      TY_SECURITY_PUBLIC_KEY: /run/verification/public.pem
      IDENTIDAD_BASE_URL: http://identidad:8085
      EVENTOS_BASE_URL: http://eventos:8081
      INVENTARIO_BASE_URL: http://inventario:8082
      ENTRADAS_BASE_URL: http://entradas:8083
      COMPRAS_BASE_URL: http://compras:8084
    ports:
      - "127.0.0.1:38080:8080"
    volumes:
      - type: bind
        source: ${IDENTITY_KEYS_DIR:-../ticketya-identity-keys}/public.pem
        target: /run/verification/public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      eventos:
        condition: service_started
      inventario:
        condition: service_started
      entradas:
        condition: service_started
      compras:
        condition: service_started
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
